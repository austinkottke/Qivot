<!doctype html>
<!--
  Custom loading shell for the WebAssembly build (nicer than Qt's default page).

  Usage: after a wasm `make`, this folder has clinic.js / clinic.wasm / qtloader.js.
  Host THIS file next to them (open index.html instead of the generated clinic.html).
  Qt's wasm loader API shifts between minor versions — if the app doesn't appear,
  open the generated clinic.html and copy its exact `qtLoad({...})` call over the one
  below (the entryFunction name is the usual culprit; Qt calls it `<target>_entry`).
  Targets Qt 6.5+.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Qivot Clinic — Qt for WebAssembly</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1220;
               color: #E8EAF2; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #screen { position: absolute; inset: 0; }
  #screen canvas { display: block; outline: none; }
  #overlay { position: absolute; inset: 0; z-index: 10; display: flex; gap: 18px;
             flex-direction: column; align-items: center; justify-content: center;
             background: #0B1220; transition: opacity .4s ease; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #3B82F6;
          display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { color: #8A93A6; font-size: 14px; max-width: 460px; text-align: center; line-height: 1.55; padding: 0 20px; }
  .spinner { width: 34px; height: 34px; border: 3px solid #202a3d; border-top-color: #3B82F6;
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="screen"></div>

  <div id="overlay">
    <div class="logo">✚</div>
    <div class="title">Qivot Clinic</div>
    <div class="spinner" id="spinner"></div>
    <div class="sub" id="status">
      Loading a Qt/QML EHR compiled to WebAssembly — an appointment scheduler and
      patient chart over an in-browser SQLite database (all data is synthetic).
      First load pulls a few MB; one sec.
    </div>
  </div>

  <script>
    if (typeof WebAssembly !== "object") {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("status").innerHTML =
        "Your browser doesn't support WebAssembly.<br>Try a recent Chrome, Firefox, Safari, or Edge.";
    }
  </script>

  <script src="qtloader.js"></script>
  <script src="clinic.js"></script>
  <script>
    async function main() {
      const overlay = document.getElementById("overlay");
      const fail = (msg) => {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = msg;
      };
      try {
        await qtLoad({
          qt: {
            // ⚠ version-sensitive line — see the comment at the top of this file.
            entryFunction: window.clinic_entry,
            containerElements: [document.getElementById("screen")],
            onLoaded: () => overlay.classList.add("hidden"),
            onExit: (e) => fail("The app exited" + (e && e.code != null ? " (code " + e.code + ")" : "") + "."),
          }
        });
      } catch (err) {
        fail("Couldn't start the app: " + err);
      }
    }
    if (typeof WebAssembly === "object") main();
  </script>
</body>
</html>
