name: Validate Code Generation & Templates

on:
  push:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/create-qivot-project.sh'
      - 'templates/**'
      - '.github/workflows/validate-gen.yml'
  pull_request:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/create-qivot-project.sh'
      - 'templates/**'

jobs:
  test-codegen:
    name: Test Code Generation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Test qivot-gen with SQLite (Phase 1 basics)
        run: |
          # Create test schema
          python3 << 'EOF'
          import sqlite3
          conn = sqlite3.connect('test.db')
          conn.executescript("""
            CREATE TABLE users (
              id INTEGER PRIMARY KEY,
              email TEXT UNIQUE NOT NULL,
              name TEXT
            );
            CREATE TABLE posts (
              id INTEGER PRIMARY KEY,
              user_id INTEGER NOT NULL,
              title TEXT NOT NULL,
              FOREIGN KEY(user_id) REFERENCES users(id)
            );
          """)
          conn.close()
          EOF

          # Generate models
          python3 tools/qivot-gen.py \
            --db sqlite:test.db \
            --output generated_models.h

          # Verify output exists and contains expected content
          if [ ! -f generated_models.h ]; then
            echo "ERROR: Output file not generated"
            exit 1
          fi

          if ! grep -q "class Users" generated_models.h; then
            echo "ERROR: Users class not found in generated code"
            exit 1
          fi

          if ! grep -q "class Posts" generated_models.h; then
            echo "ERROR: Posts class not found in generated code"
            exit 1
          fi

          if ! grep -q "QiForeignKey<Users>" generated_models.h; then
            echo "ERROR: Foreign key not found in generated code"
            exit 1
          fi

          echo "✓ Phase 1: Basic code generation successful"

      - name: Test qivot-gen Phase 3 Features (Composite Keys, Constraints)
        run: |
          # Create schema with Phase 3 features
          python3 << 'EOF'
          import sqlite3
          conn = sqlite3.connect('test_phase3.db')
          conn.executescript("""
            CREATE TABLE users (
              id INTEGER PRIMARY KEY,
              email TEXT UNIQUE NOT NULL,
              age INTEGER CHECK (age >= 18),
              name TEXT
            );

            CREATE TABLE user_permissions (
              user_id INTEGER NOT NULL,
              permission_id INTEGER NOT NULL,
              granted_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              PRIMARY KEY (user_id, permission_id),
              FOREIGN KEY (user_id) REFERENCES users(id)
            );

            CREATE TABLE posts (
              id INTEGER PRIMARY KEY,
              user_id INTEGER NOT NULL,
              title TEXT NOT NULL,
              deleted_at TIMESTAMP,
              FOREIGN KEY (user_id) REFERENCES users(id)
            );

            CREATE TABLE comments (
              id INTEGER PRIMARY KEY,
              commentable_type TEXT NOT NULL,
              commentable_id INTEGER NOT NULL,
              content TEXT,
              user_id INTEGER,
              FOREIGN KEY (user_id) REFERENCES users(id)
            );
          """)
          conn.close()
          EOF

          # Generate models with Phase 3 features
          python3 tools/qivot-gen.py \
            --db sqlite:test_phase3.db \
            --output generated_phase3.h

          # Verify Phase 3 features
          echo "Checking Phase 3 features in generated code..."

          # Check composite key detection
          if ! grep -q "Composite key" generated_phase3.h; then
            echo "ERROR: Composite key warning not found"
            exit 1
          fi

          # Check constraint detection
          if ! grep -q "unique" generated_phase3.h; then
            echo "ERROR: UNIQUE constraint comment not found"
            exit 1
          fi

          # Check soft delete detection
          if ! grep -q "soft delete" generated_phase3.h; then
            echo "ERROR: Soft delete marker not found"
            exit 1
          fi

          # Check polymorphic detection
          if ! grep -q "polymorphic" generated_phase3.h; then
            echo "ERROR: Polymorphic relationship not detected"
            exit 1
          fi

          # Verify model generation for composite key table
          if ! grep -q "class UserPermissions" generated_phase3.h; then
            echo "ERROR: UserPermissions class not found"
            exit 1
          fi

          if ! grep -q "QI_DECLARE_MODEL_NOID" generated_phase3.h; then
            echo "ERROR: QI_DECLARE_MODEL_NOID guidance not found for composite key"
            exit 1
          fi

          echo "✓ Phase 3: Composite keys, constraints, patterns detected correctly"

      - name: Run Phase 3 Validation Test Suite
        run: |
          chmod +x tools/test-phase3-improvements.py
          python3 tools/test-phase3-improvements.py

          if [ $? -ne 0 ]; then
            echo "ERROR: Phase 3 validation tests failed"
            exit 1
          fi

          echo "✓ Phase 3 validation tests passed"

      - name: Test qivot-gen with Clinic Schema (7 tables, FTS filtering)
        run: |
          # Create clinic schema (healthcare management system)
          python3 << 'EOF'
          import sqlite3
          conn = sqlite3.connect('clinic.db')
          conn.executescript("""
            CREATE TABLE appointment (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              provider_id INTEGER NOT NULL,
              day TEXT,
              minute INTEGER,
              duration_min INTEGER,
              reason TEXT,
              status INTEGER
            );

            CREATE TABLE medication (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              name TEXT,
              dose TEXT,
              frequency TEXT,
              active BOOLEAN
            );

            CREATE TABLE note (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              provider_id INTEGER NOT NULL,
              date TEXT,
              kind INTEGER,
              body TEXT
            );

            CREATE TABLE patient (
              id INTEGER PRIMARY KEY,
              mrn TEXT,
              first_name TEXT,
              last_name TEXT,
              dob TEXT,
              sex TEXT,
              phone TEXT,
              blood_type TEXT,
              allergies TEXT
            );

            CREATE TABLE problem (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              name TEXT,
              status INTEGER,
              onset TEXT
            );

            CREATE TABLE provider (
              id INTEGER PRIMARY KEY,
              name TEXT,
              specialty TEXT,
              color TEXT
            );

            CREATE TABLE vital (
              id INTEGER PRIMARY KEY,
              patient_id INTEGER NOT NULL,
              taken_on TEXT,
              systolic INTEGER,
              diastolic INTEGER,
              heart_rate INTEGER,
              temp_c REAL,
              weight_kg REAL,
              height_cm INTEGER,
              spo2 INTEGER
            );

            -- FTS5 tables (should be skipped)
            CREATE VIRTUAL TABLE note_fts USING fts5(body);
          """)
          conn.close()
          EOF

          # Generate models
          python3 tools/qivot-gen.py \
            --db sqlite:clinic.db \
            --output clinic_models.h

          if [ ! -f clinic_models.h ]; then
            echo "ERROR: clinic_models.h not generated"
            exit 1
          fi

          # Verify clinic models (7 real tables, FTS tables skipped)
          echo "Checking generated clinic models..."
          for model in Appointment Medication Note Patient Problem Provider Vital; do
            if ! grep -q "class $model" clinic_models.h; then
              echo "ERROR: $model class not found in clinic_models.h"
              exit 1
            fi
          done

          # Verify FTS tables were skipped (should not generate models)
          if grep -q "class NoteFts" clinic_models.h; then
            echo "ERROR: FTS tables should have been skipped"
            exit 1
          fi

          echo "✓ Clinic schema test successful (7 models, FTS tables skipped)"

      - name: Test Error Handling
        run: |
          # Test invalid database path (should fail gracefully with exit code 1)
          output=$(python3 tools/qivot-gen.py \
            --db sqlite:/nonexistent/path.db \
            --output /tmp/out.h 2>&1)
          exit_code=$?

          if [ $exit_code -eq 1 ]; then
            echo "✓ Fails gracefully on nonexistent database (exit code 1)"
          else
            echo "ERROR: Should return exit code 1 for nonexistent database"
            exit 1
          fi

          # Test unsupported database type
          output=$(python3 tools/qivot-gen.py \
            --db invalid://connection \
            --output /tmp/out.h 2>&1)
          exit_code=$?

          if [ $exit_code -eq 1 ]; then
            echo "✓ Rejects unsupported database types (exit code 1)"
          else
            echo "ERROR: Should return exit code 1 for unsupported database"
            exit 1
          fi

  test-templates:
    name: Test Project Templates
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        qt-version: ['6.5.0']

    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Test CMake template (console)
        run: |
          # Copy template
          mkdir test-cmake-app
          cp -r templates/cmake/MyQivotProject/* test-cmake-app/

          # Create build directory
          mkdir test-cmake-app/build
          cd test-cmake-app/build

          # Configure (adjust Qt path)
          cmake .. -DCMAKE_PREFIX_PATH=$Qt6_DIR

          echo "✓ CMake configuration successful"

      - name: Test CMake template (QML)
        run: |
          # Copy template
          mkdir test-qml-app
          cp -r templates/cmake/MyQivotQmlApp/* test-qml-app/

          # Create build directory
          mkdir test-qml-app/build
          cd test-qml-app/build

          # Configure
          cmake .. -DCMAKE_PREFIX_PATH=$Qt6_DIR

          echo "✓ QML template CMake configuration successful"

  test-scripts:
    name: Test Generator Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Test create-qivot-project.sh
        run: |
          # Make script executable
          chmod +x tools/create-qivot-project.sh

          # Test CMake project creation
          tools/create-qivot-project.sh TestApp --cmake
          if [ ! -d TestApp ]; then
            echo "ERROR: Project directory not created"
            exit 1
          fi
          if [ ! -f TestApp/CMakeLists.txt ]; then
            echo "ERROR: CMakeLists.txt not created"
            exit 1
          fi
          if [ ! -f TestApp/src/main.cpp ]; then
            echo "ERROR: main.cpp not created"
            exit 1
          fi

          # Test qmake project creation
          tools/create-qivot-project.sh TestAppQmake --qmake
          if [ ! -f TestAppQmake/TestAppQmake.pro ]; then
            echo "ERROR: .pro file not created"
            exit 1
          fi

          # Test QML variant
          tools/create-qivot-project.sh TestQmlApp --cmake --qml
          if [ ! -f TestQmlApp/qml/main.qml ]; then
            echo "ERROR: main.qml not created"
            exit 1
          fi
          if [ ! -f TestQmlApp/src/store.h ]; then
            echo "ERROR: store.h not created"
            exit 1
          fi

          echo "✓ Project generator script tests passed"
