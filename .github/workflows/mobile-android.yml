name: Android

# Builds Qivot for Android with Qt 6, runs the unit test suite on an emulator,
# and smoke-tests the Contacts example (it must start with no QML errors).
# The steps live in tools/run-mobile-tests.sh so a local run matches CI exactly
# — see docs/Mobile.md.

on:
  push:
    branches: [ main ]
    paths: [ "src/**", "tests/**", "examples/contacts/**",
             "tools/run-mobile-tests.sh", ".github/workflows/mobile-android.yml" ]
  pull_request:
    paths: [ "src/**", "tests/**", "examples/contacts/**",
             "tools/run-mobile-tests.sh", ".github/workflows/mobile-android.yml" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  # The NDK Qt 6.8 is built and tested against. Bump together with QT_VERSION.
  NDK_VERSION: 26.1.10909125
  ANDROID_API: 34

jobs:
  android:
    name: android · Qt 6.8 · emulator (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and SDK platform
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;$NDK_VERSION" "platforms;android-$ANDROID_API" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Host Qt — moc/rcc/androiddeployqt run on the host.
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Remember host path
        run: |
          echo "QT_HOST=$QT_ROOT_DIR"      >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # Target Qt. x86_64 so the emulator runs natively under KVM.
      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          cache: true
      - name: Remember target path
        run: echo "QT_MOBILE=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Build unit tests and Contacts
        run: tools/run-mobile-tests.sh android --build-only

      # Hardware acceleration for the emulator (the recommended setup for
      # reactivecircus/android-emulator-runner on Linux runners).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tools/run-mobile-tests.sh android --run-only

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          if-no-files-found: ignore
          path: |
            build-mobile/android/*/android-build/build/outputs/apk/debug/*.apk
            build-mobile/android/*.log
