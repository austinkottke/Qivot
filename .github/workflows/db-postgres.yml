name: PostgreSQL

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: db-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration · PostgreSQL (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qivot
          POSTGRES_DB: qivot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 + PostgreSQL driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qmake6 qt6-base-dev libqt6sql6-sqlite libqt6sql6-psql

      - name: Build the integration test
        working-directory: tests/integration
        run: |
          qmake6
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Run against PostgreSQL
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
        run: ./integration postgres
