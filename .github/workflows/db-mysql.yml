name: MySQL / MariaDB

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: db-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration · MySQL / MariaDB (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: qivot
          MARIADB_DATABASE: qivot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 + MySQL driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qmake6 qt6-base-dev libqt6sql6-sqlite libqt6sql6-mysql

      - name: Build the integration test
        working-directory: tests/integration
        run: |
          qmake6
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Run against MySQL / MariaDB
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
        run: ./integration mysql
