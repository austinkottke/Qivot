name: Validate SQL Server Parser

on:
  push:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/schemas/sqlserver-schema.sql'
      - 'tools/docker-compose-sqlserver.yml'
      - '.github/workflows/validate-sqlserver.yml'
  pull_request:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/schemas/sqlserver-schema.sql'
      - 'tools/docker-compose-sqlserver.yml'
  schedule:
    # Run weekly to catch regressions
    - cron: '0 3 * * 0'

jobs:
  validate-sqlserver:
    name: SQL Server Parser Validation
    runs-on: ubuntu-latest

    services:
      # SQL Server 2019
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: TestPass123!
          ACCEPT_EULA: "Y"
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPass123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freetds-bin tdsodbc unixodbc-dev
          pip install pyodbc

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            sqlcmd -S localhost -U sa -P TestPass123! -Q "SELECT 1" && break || sleep 1
          done

      - name: Initialize SQL Server schema
        run: |
          sqlcmd -S localhost -U sa -P TestPass123! -i tools/schemas/sqlserver-schema.sql

      - name: Validate SQL Server schema
        run: |
          python3 tools/qivot-gen.py \
            --db "mssql+pyodbc://sa:TestPass123!@localhost:1433/qivot_test?driver=ODBC+Driver+17+for+SQL+Server" \
            --output /tmp/sqlserver_models.h
          echo "✓ SQL Server: Generated models for DevOps platform schema"

      - name: Verify model counts
        run: |
          echo "SQL Server models: $(grep -c '^class ' /tmp/sqlserver_models.h) (expected: ~11)"

      - name: Verify FK detection
        run: |
          echo "Foreign keys detected: $(grep -c 'QiForeignKey' /tmp/sqlserver_models.h)"
          echo "Unique constraints detected: $(grep -c 'unique' /tmp/sqlserver_models.h)"
          echo "Check constraints detected: $(grep -c 'CHECK' /tmp/sqlserver_models.h)"

      - name: Upload generated models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-models
          path: /tmp/sqlserver_models.h
          retention-days: 7

      - name: Report results
        if: success()
        run: |
          echo "✅ SQL Server parser validation PASSED"
          echo ""
          echo "Validated SQL Server schema:"
          echo "  - 11 tables with complex relationships"
          echo "  - FK detection via sys.foreign_keys"
          echo "  - UNIQUE and CHECK constraints"
          echo "  - Composite key support"
