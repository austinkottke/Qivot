name: SQL Server Parser Unit Tests

on:
  push:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/test-sqlserver-parser.py'
      - '.github/workflows/validate-sqlserver.yml'
  pull_request:
    paths:
      - 'tools/qivot-gen.py'
      - 'tools/test-sqlserver-parser.py'
  schedule:
    # Run weekly to catch regressions
    - cron: '0 3 * * 0'

jobs:
  test-sqlserver-parser:
    name: SQL Server Parser Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run SQL Server Parser unit tests
        run: |
          python3 tools/test-sqlserver-parser.py

      - name: Report test results
        if: success()
        run: |
          echo "✅ SQL Server Parser unit tests PASSED"
          echo ""
          echo "Test coverage:"
          echo "  ✓ Type mapping (9 SQL Server types → C++)"
          echo "  ✓ Connection string recognition"
          echo "  ✓ Foreign key detection logic"
          echo "  ✓ Composite key detection"
          echo "  ✓ UNIQUE constraint detection"
          echo "  ✓ CHECK constraint detection"
          echo "  ✓ Schema pattern detection"
          echo ""
          echo "For integration testing with a real SQL Server:"
          echo "  docker-compose -f tools/docker-compose-sqlserver.yml up"
          echo "  python3 tools/qivot-gen.py --db mssql+pyodbc://... --output models.h"
