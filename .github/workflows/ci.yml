name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GCC/Clang via the official Qt installer (aqt): Qt 5.15 and Qt 6, x86_64 and
  # native arm64 (macos-latest is Apple Silicon; Qt 6's macOS build is universal).
  aqt:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux · gcc · Qt 5.15
            os: ubuntu-22.04
            qt: '5.15.2'
            arch: gcc_64
            examples: true
          - name: linux · gcc · Qt 6.5
            os: ubuntu-22.04
            qt: '6.5.3'
            arch: gcc_64
            examples: false
          # macos-15-intel: x86_64 runner (macos-13 was retired Dec 2025). Qt 5.15's
          # macOS build is Intel-only, so it needs an Intel runner.
          - name: macos · clang · Qt 5.15 (x86_64)
            os: macos-15-intel
            qt: '5.15.2'
            arch: clang_64
            examples: true
          # macos-latest is Apple Silicon; Qt 6 ships a universal build, so this runs
          # natively on arm64.
          - name: macos · clang · Qt 6.5 (arm64)
            os: macos-latest
            qt: '6.5.3'
            arch: clang_64
            examples: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true

      # Compiles the whole library (all of src/) and runs CoreTests + SqliteTests.
      # A non-zero exit fails the job.
      - name: Build & run unit tests
        working-directory: tests/unittests
        run: |
          qmake
          make -j"$(getconf _NPROCESSORS_ONLN)"
          ./unittests

      # The examples are QtQuick/QML apps; build them on the Qt 5 jobs (whose default
      # install carries QtDeclarative). Qt 6 / arm64 coverage is the library + tests above.
      - name: Build all examples
        if: matrix.examples
        working-directory: examples
        run: |
          qmake
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Header-only build (dist/qivot.hpp) is up to date
        if: matrix.qt == '5.15.2' && runner.os == 'Linux'
        run: |
          python3 tools/amalgamate.py
          git diff --exit-code -- dist/qivot.hpp \
            || (echo "::error::dist/qivot.hpp is stale — run 'python3 tools/amalgamate.py' and commit." && exit 1)

  # Native arm64 Linux, using the distro's Qt 6 (qmake6). Library + unit tests only —
  # keeps the dependency set to qtbase + the SQLite driver; examples are covered above.
  linux-arm64:
    name: linux-arm64 · gcc · Qt 6 (distro)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qmake6 qt6-base-dev libqt6sql6-sqlite

      - name: Build & run unit tests
        working-directory: tests/unittests
        run: |
          qmake6
          make -j"$(getconf _NPROCESSORS_ONLN)"
          ./unittests

  # Live MySQL/MariaDB + PostgreSQL + SQL Server: distro Qt 6 (which ships the
  # QMYSQL/QPSQL/QODBC driver plugins), with the databases as service containers.
  # Runs the integration round-trip against each real server. QIVOT_REQUIRE_DB=1
  # makes a missing driver or failed connection a hard failure (not a skip), so
  # this job genuinely gates multi-database support.
  #
  # Oracle isn't included here: Qt's QOCI plugin isn't packaged for Ubuntu the way
  # QMYSQL/QPSQL/QODBC are (it may need building from Qt source against Oracle
  # Instant Client), so live Oracle integration is deferred — see
  # src/qioraclestatement.h, which the SQL-generation unit tests already cover.
  db-integration:
    name: db-integration · MySQL + Postgres + SQL Server (Qt 6 distro)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: qivot
          MARIADB_DATABASE: qivot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qivot
          POSTGRES_DB: qivot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # SQL Server has no "just give it a database name" env var like the other
      # two — qivot_test is created by hand in a step below. The SA password must
      # meet SQL Server's complexity rules (8+ chars, 3 of 4 character classes);
      # the "qivot" password used above would be rejected here.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Qivot_Test1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 + MySQL/Postgres/SQL Server SQL driver plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qmake6 qt6-base-dev libqt6sql6-sqlite libqt6sql6-mysql libqt6sql6-psql \
            libqt6sql6-odbc unixodbc unixodbc-dev curl gnupg
          # Debian/Ubuntu's Qt6 ODBC plugin links against unixODBC (the standard
          # driver manager on Linux), unlike the macOS build of Qt (which links
          # against iODBC — see tests/integration/README.md's macOS caveat for why
          # that combination doesn't work with Microsoft's driver locally). So this
          # apt-based unixODBC + msodbcsql18 combination is expected to avoid that
          # problem entirely — Microsoft's own driver documentation only supports
          # unixODBC on Linux/macOS in the first place.
          #
          # Microsoft's ODBC driver for SQL Server isn't in Ubuntu's own repos —
          # this adds Microsoft's own apt repo, matching Microsoft's documented
          # install instructions (learn.microsoft.com/sql/connect/odbc/linux-mac/
          # installing-the-microsoft-odbc-driver-for-sql-server).
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 mssql-tools18

      - name: Create the qivot_test database on SQL Server
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P "Qivot_Test1" -C \
            -Q "IF DB_ID('qivot_test') IS NULL CREATE DATABASE qivot_test;"

      - name: Build the integration test
        working-directory: tests/integration
        run: |
          qmake6
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Run against SQLite (in-memory, same suite)
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
        run: ./integration sqlite

      - name: Run against PostgreSQL
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
        run: ./integration postgres

      - name: Run against MySQL / MariaDB
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
        run: ./integration mysql

      - name: Run against SQL Server
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
          QIVOT_USER: sa
          QIVOT_PASS: "Qivot_Test1"
        run: ./integration sqlserver

  # DuckDB is embedded, so this needs no service container — just qtbase plus the
  # libduckdb C API bundle. Qt ships no DuckDB driver, so the test build compiles the
  # bundled QDUCKDB driver (drivers/duckdb) against libduckdb and runs the same
  # integration round-trip in-process. Pinned to the DuckDB version the driver was
  # validated against (bump deliberately).
  duckdb:
    name: db-integration · DuckDB (embedded)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qmake6 qt6-base-dev curl unzip

      - name: Fetch the libduckdb C API bundle
        run: |
          curl -sSL -o libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          mkdir -p "$GITHUB_WORKSPACE/duckdblib"
          unzip -o libduckdb.zip -d "$GITHUB_WORKSPACE/duckdblib"

      - name: Build the integration test with DuckDB
        working-directory: tests/integration
        run: |
          qmake6 CONFIG+=duckdb DUCKDB_DIR="$GITHUB_WORKSPACE/duckdblib"
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Run against DuckDB (in-memory)
        working-directory: tests/integration
        env:
          QIVOT_REQUIRE_DB: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/duckdblib
        run: ./integration duckdb

  windows:
    name: windows-latest (msvc)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build & run unit tests
        working-directory: tests/unittests
        shell: pwsh
        run: |
          qmake; if ($LASTEXITCODE) { exit 1 }
          nmake; if ($LASTEXITCODE) { exit 1 }
          $exe = Get-ChildItem -Recurse -Filter unittests.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'unittests.exe not found'; exit 1 }
          & $exe.FullName
          exit $LASTEXITCODE

      - name: Build all examples
        working-directory: examples
        shell: pwsh
        run: |
          qmake; if ($LASTEXITCODE) { exit 1 }
          nmake; if ($LASTEXITCODE) { exit 1 }
