# Spin up MySQL and Postgres for Qivot's integration tests:
#   docker compose -f tests/integration/docker-compose.yml up -d
# Then point the tests at them (see tests/integration/README.md), and:
#   docker compose -f tests/integration/docker-compose.yml down
services:
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: qivot
      MARIADB_DATABASE: qivot_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: qivot
      POSTGRES_DB: qivot_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
